spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.application.name=miro
server.port=8080

jwt.secret.key=${JWT_SECRET_KEY:dev_fallback_key_256bit}

server.tomcat.max-http-form-post-size=10MB
server.tomcat.max-swallow-size=10MB

logging.level.org.springframework.web.socket=DEBUG
logging.level.org.springframework.messaging.simp=DEBUG

server.servlet.context-parameters.org.apache.tomcat.websocket.textBufferSize=10485760
server.servlet.context-parameters.org.apache.tomcat.websocket.binaryBufferSize=10485760